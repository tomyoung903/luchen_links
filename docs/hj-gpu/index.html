<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening Luchen link…</title>
  <!-- generated by luchen-links; destination is resolved from ../links.json -->
  <style>
    body { margin: 0; background: #f4f7f8; color: #17212b; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(620px, calc(100% - 32px)); margin: 12vh auto; border: 1px solid #ced8df; border-radius: 12px; background: #fff; padding: 28px; box-shadow: 0 10px 30px rgba(23,33,43,.07); }
    h1 { margin: 0 0 10px; font-size: 1.55rem; }
    p { color: #5d6a76; }
    code { color: #0f766e; overflow-wrap: anywhere; }
    a { color: #245f9e; }
    .error { color: #8b4f13; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Opening managed link…</h1>
    <p id="status">Resolving the latest destination from the public link manifest.</p>
    <p><code id="slug"></code></p>
    <p><a href="../">Return to Luchen Links</a></p>
    <noscript><p class="error">JavaScript is required because this redirect resolves its destination from the live manifest.</p></noscript>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const title = document.getElementById("title");
      const slugNode = document.getElementById("slug");
      const parts = location.pathname.split("/").filter(Boolean);
      const slug = decodeURIComponent(parts.at(-1) || "");
      slugNode.textContent = slug;
      try {
        const manifestUrl = new URL("../links.json", location.href);
        manifestUrl.searchParams.set("revision", Date.now());
        const response = await fetch(manifestUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`Manifest request failed with ${response.status}`);
        const manifest = await response.json();
        const record = manifest.links?.find((item) => item.slug === slug);
        if (!record) throw new Error(`No managed link exists for “${slug}”`);
        title.textContent = record.title;
        status.textContent = "Destination resolved. Redirecting now…";
        document.title = `Opening ${record.title}…`;
        location.replace(record.url);
      } catch (error) {
        title.textContent = "Managed link unavailable";
        status.className = "error";
        status.textContent = error.message;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
